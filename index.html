<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Unnati weds Nisarg - Wedding Invitation</title>
  <meta name="description" content="Two hearts one journey a lifetime together. Join us in celebrating the wedding of Unnati and Nisarg at The German Palace, Ahmedabad." />
  <meta name="theme-color" content="#f7e6ea" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Music Audio -->
  <audio id="bg-audio" loop preload="auto">
    <source src="assets/vela_milan_ni.mp3" type="audio/mpeg" />
    <source src="assets/soothing_bless.mp3" type="audio/mpeg" />
  </audio>

  <!-- ==============================================================
       ROYAL MORPANKH (PEACOCK FEATHER) INTRO ANIMATION
       From: thejogendersingh/morpankh-intro-invcraftmedia
       ============================================================== -->
  <div id="intro-wrapper">
    <!-- Dark Emerald Textured Backdrop -->
    <div id="intro-backdrop" class="intro-backdrop-layer">
      <div class="intro-radial-vignette"></div>
    </div>

    <!-- Interactive Intro Stage -->
    <div id="intro-stage" class="intro-stage">
      
      <!-- Audio Element for Realistic Feather Rustle Effect -->
      <audio id="rustle-audio" src="animations/peacock-feather/feather-rustle.mp3" preload="auto" aria-hidden="true"></audio>

      <!-- Auspicious Top Blessing with Theme-Matching Transparent Ganesha -->
      <div class="intro-ganesh-block">
        <img src="assets/ganesha.svg" alt="Lord Ganesha" class="intro-ganesh-img" />
        <div class="intro-shloka">॥ श्री गणेशाय नमः ॥</div>
      </div>

      <!-- Center Tap Prompt with Hand Ripple & Gesture -->
      <div id="tap-prompt" class="tap-prompt-container">
        <div class="tap-ripple-wrapper">
          <div class="ripple-circle"></div>
          <div class="ripple-circle delayed"></div>
          <div class="hand-icon-wrapper">
            <svg class="hand-svg" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M15.5 2C14.12 2 13 3.12 13 4.5V14.65L11.53 13.18C10.55 12.2 8.95 12.2 7.97 13.18C7.45 13.7 7.21 14.41 7.29 15.11C7.38 15.82 7.78 16.44 8.38 16.85L14.7 25.13C16.03 26.88 18.11 27.91 20.33 27.91H23C26.31 27.91 29 25.22 29 21.91V14.5C29 13.12 27.88 12 26.5 12C26.17 12 25.86 12.06 25.57 12.18C25.19 11.18 24.23 10.5 23.1 10.5C22.77 10.5 22.45 10.56 22.16 10.68C21.78 9.68 20.82 9 19.69 9C19.46 9 19.23 9.03 19.01 9.1V4.5C19.01 3.12 17.89 2 16.51 2H15.5Z"/>
            </svg>
          </div>
        </div>
        <div class="tap-label-group">
          <span class="tap-label">Click the peacock to open invitation</span>
          <div class="tap-divider-line"></div>
        </div>
      </div>

      <!-- Desktop Feathers Cluster (4 tiers, 47 feathers) -->
      <div id="peacock-feathers-cluster" class="peacock-feathers-cluster"></div>

      <!-- Mobile Canvas (High-Performance 2D Engine) -->
      <canvas id="peacock-canvas"></canvas>

      <!-- Golden Floating Sparkles Cluster -->
      <div id="peacock-sparkles-cluster" class="peacock-sparkles-container"></div>

      <!-- Royal Peacock Body at Bottom -->
      <div id="peacock-body-anchor" class="peacock-body-anchor">
        <div class="peacock-halo-glow"></div>
        <div id="peacock-body-elem" class="peacock-body-elem peacock-body-resting">
          <img src="animations/peacock-feather/peacock-body.webp" alt="Royal Peacock" class="peacock-body-img" draggable="false" />
        </div>
      </div>

    </div>
  </div>

  <!-- =========================================
       MAIN APPLICATION / PALACE EXPERIENCE
       ========================================= -->

    <!-- Fixed Palace Background Layer (Swipable Haveli/Palace Bases) -->

        <img src="assets/base-3-mobile.webp" class="bg-image-full" id="palace-bg-img" alt="Royal Pink Palace Backdrop" />

    <!-- Rose Petals & Golden Sparkles Canvas -->
    <canvas id="particles-canvas"></canvas>

    <!-- Floating Top Bar Controls -->

          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <line x1="23" y1="9" x2="17" y2="15"></line>
          <line x1="17" y1="9" x2="23" y2="15"></line>

      </button>

            <span>हिन्दी (Hindi)</span>
          </div>
          <div class="lang-option" data-lang="gu" data-name="ગુજરાતી">

            <span>ਪੰਜਾਬੀ (Punjabi)</span>

          <!-- ================= ONLY ACTIVE SECTION: RSVP ================= -->
          <section class="invitation-card active card-rsvp" data-card="0">
            <h3 class="card-script-title" data-i18n="rsvpTitle">RSVP</h3>
            <p class="card-subtitle" data-i18n="rsvpSubtitle">Please let us know if you can make it</p>

            <form class="rsvp-form-container" id="wedding-rsvp-form">
              <div>
                <label class="rsvp-label" for="guest-name">Your Name</label>
                <input type="text" id="guest-name" class="rsvp-input" placeholder="e.g. Rahul Verma" required />
              </div>

              <div>
                <label class="rsvp-label" for="guest-count">Number of Guests</label>
                <select id="guest-count" class="rsvp-select">
                  <option value="1">1 Guest</option>
                  <option value="2" selected>2 Guests</option>
                  <option value="3">3 Guests</option>
                  <option value="4">4 Guests</option>
                  <option value="5+">5+ Guests (Family)</option>
                </select>
              </div>

              <div class="rsvp-radio-group">
                <label class="rsvp-radio-label">
                  <input type="radio" name="attendance" value="attending" checked />
                  <span>Joyfully attending</span>
                </label>
                <label class="rsvp-radio-label">
                  <input type="radio" name="attendance" value="declined" />
                  <span>Regretfully declines</span>
                </label>
              </div>

              <div>
                <label class="rsvp-label" for="guest-msg">Message for the Couple</label>
                <textarea id="guest-msg" class="rsvp-textarea" rows="2" placeholder="Wishing you both a lifetime of love..."></textarea>
              </div>

              <label class="rsvp-terms-label">
                <input type="checkbox" required checked />
                <span>I agree to the <span class="rsvp-terms-link">RSVP terms & conditions</span></span>
              </label>

              <button type="submit" class="rsvp-submit-btn">
                <span>Submit RSVP</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </form>

            <div class="rsvp-success-banner" id="rsvp-success-msg">
              <strong style="display:block; margin-bottom: 2px;">Thank you! ✨</strong>
              <span>Your RSVP has been received with warm gratitude. We look forward to celebrating with you!</span>
            </div>
